# Servicios por defecto (entorno de desarrollo).
#
# En producción define los servicios con variables de entorno SVC_<ID>_<CAMPO>
# (ver README, "Versión pública") y este fichero se ignora. También puede
# apuntarse a otro fichero con SERVICES_FILE.
services:
  - id: web
    name: Web
    type: http
    url: https://ejemplo.com
    docs_url: https://ejemplo.com/docs       # opcional
    description: Web corporativa.            # opcional

  - id: api
    name: API
    type: http
    url: https://api.ejemplo.com
    verify_tls: true                          # false para red privada con certificados propios

  - id: base_datos
    name: Base de datos
    type: mysql
    host: db.ejemplo.com
    port: 3306
    credentials_env:                          # opcional: check completo en vez de solo TCP
      user: MYSQL_USER
      password: MYSQL_PASSWORD
      database: MYSQL_DATABASE
